name: t301-multibase
services:
  api:
    build: .
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    environment:
      POSTGRES_URL: postgresql://tienda:demo_local@postgres:5432/tienda
      MONGO_URL: mongodb://mongo:27017
      MONGO_DB: tienda
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/salud')"]
      interval: 10s
      timeout: 5s
      retries: 10
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: tienda
      POSTGRES_PASSWORD: demo_local
      POSTGRES_DB: tienda
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tienda -d tienda"]
      interval: 5s
      timeout: 5s
      retries: 20
  mongo:
    image: mongo:8.0
    volumes: ["mongo_data:/data/db"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand({ping:1})"]
      interval: 5s
      timeout: 5s
      retries: 20
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "always"]
    volumes: ["redis_data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  postgres_data:
  mongo_data:
  redis_data:
